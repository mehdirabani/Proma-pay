name: Frontend Forge v14.3 Conformance
on: [workflow_dispatch, pull_request]
jobs:
  core-runtime:
    runs-on: ubuntu-latest
    steps: [{uses: actions/checkout@v4}, {uses: actions/setup-python@v5, with: {python-version: '3.12'}}, {run: 'pip install -r requirements.txt && python tests/run_tests.py'}]
  sandbox-bubblewrap:
    runs-on: ubuntu-latest
    steps: [{uses: actions/checkout@v4}, {run: 'sudo apt-get update && sudo apt-get install -y bubblewrap'}, {run: 'python tests/environment_jobs/v143_sandbox_conformance.py'}]
  browser-chromium:
    runs-on: ubuntu-latest
    steps: [{uses: actions/checkout@v4}, {uses: actions/setup-python@v5, with: {python-version: '3.12'}}, {run: 'pip install playwright && playwright install --with-deps chromium'}, {run: 'python tests/environment_jobs/v143_browser_conformance.py'}]
  lighthouse:
    runs-on: ubuntu-latest
    steps: [{uses: actions/checkout@v4}, {uses: actions/setup-node@v4, with: {node-version: '22'}}, {run: 'npm i -g lighthouse'}, {run: 'python tests/environment_jobs/v143_lighthouse_conformance.py'}]
  axe:
    runs-on: ubuntu-latest
    steps: [{uses: actions/checkout@v4}, {uses: actions/setup-node@v4, with: {node-version: '22'}}, {run: 'npm i @axe-core/playwright playwright && npx playwright install --with-deps chromium'}, {run: 'python tests/environment_jobs/v143_axe_conformance.py'}]
