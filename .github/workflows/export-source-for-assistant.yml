name: Export source for assistant

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Create source archive
        shell: bash
        run: |
          git archive --format=zip --output=Proma-pay-main-source.zip HEAD
          sha256sum Proma-pay-main-source.zip > Proma-pay-main-source.sha256

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: Proma-pay-main-source
          path: |
            Proma-pay-main-source.zip
            Proma-pay-main-source.sha256
          if-no-files-found: error
          retention-days: 1
